[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trucha-smart"
version = "0.1.0"
description = "TruchaSmart: Sistema Inteligente para Optimización de Producción Piscícola de Trucha"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "reportlab>=4.2",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "import-linter>=2.1",
    "playwright>=1.47",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]  # Depends() en firmas de FastAPI

[tool.ruff.lint.per-file-ignores]
# Datos de prueba (XML/YAML) en línea.
"tests/unit/test_gqm_metrics.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "e2e: pruebas extremo a extremo con Playwright (requieren navegador)",
]
addopts = "-ra"
filterwarnings = [
    # Aviso de Starlette sobre su cliente de pruebas; no afecta a la aplicación.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["src/domain"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

# ---------------------------------------------------------------------------
# Reglas de dependencia de la arquitectura hexagonal (verificadas en CI)
#   adapters -> ports -> domain
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["src"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "El dominio no depende de los adaptadores"
type = "forbidden"
source_modules = ["src.domain"]
forbidden_modules = ["src.adapters"]

[[tool.importlinter.contracts]]
name = "Los puertos no dependen de los adaptadores"
type = "forbidden"
source_modules = ["src.ports"]
forbidden_modules = ["src.adapters"]

[[tool.importlinter.contracts]]
name = "Dominio y puertos no dependen de frameworks"
type = "forbidden"
source_modules = ["src.domain", "src.ports"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "pydantic",
    "sqlalchemy",
    "jinja2",
    "jwt",
    "bcrypt",
    "reportlab",
    "yaml",
    "httpx",
    "requests",
    "uvicorn",
    "psycopg",
]
