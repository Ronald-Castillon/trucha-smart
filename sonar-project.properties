# Análisis estático con SonarQube (docs/calidad/sonarqube.md). Ejecución local:
#   python tools/cobertura_sonar.py        # pruebas + coverage-sonar.xml con rutas relativas
#   docker run --rm -e SONAR_HOST_URL=http://host.docker.internal:9000 -e SONAR_TOKEN=<token> \
#     -v "$PWD:/usr/src" sonarsource/sonar-scanner-cli
sonar.projectKey=truchasmart
sonar.projectName=TruchaSmart
sonar.sources=src,tools
sonar.tests=tests
sonar.exclusions=**/__pycache__/**,**/*.pyc
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage-sonar.xml
sonar.coverage.exclusions=tools/**

# Excepciones justificadas (Issue #54). Cada una se revisó a mano:
sonar.issue.ignore.multicriteria=tabindex,azar,salida
# Web:S6845 · tabindex="0" en las tablas desplazables: lo exige WCAG 2.1.1 / axe-core
# scrollable-region-focusable para poder desplazarlas con el teclado (defecto #38).
sonar.issue.ignore.multicriteria.tabindex.ruleKey=Web:S6845
sonar.issue.ignore.multicriteria.tabindex.resourceKey=src/adapters/inbound/web/templates/**/*.html
# python:S2245 · random.Random(semilla) genera datos sintéticos reproducibles; no es criptográfico.
sonar.issue.ignore.multicriteria.azar.ruleKey=python:S2245
sonar.issue.ignore.multicriteria.azar.resourceKey=tools/entrenar_modelo_riesgo.py
# python:S3516 · main() devuelve el código de salida del CLI (0); los errores se propagan.
sonar.issue.ignore.multicriteria.salida.ruleKey=python:S3516
sonar.issue.ignore.multicriteria.salida.resourceKey=tools/init_db.py
