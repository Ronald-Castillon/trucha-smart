name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  calidad:
    name: Calidad (lint, arquitectura, pruebas, OpenAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Linter (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Pureza del dominio (M1.1)
        run: python tools/check_domain_purity.py

      - name: Contratos de arquitectura (import-linter)
        run: lint-imports

      - name: Contraste de la paleta WCAG 2.1 AA (RNF-U)
        run: python tools/contraste_paleta.py

      - name: Pruebas unitarias e integración con cobertura del dominio (M2.3)
        run: >
          pytest -m "not e2e"
          --cov=src/domain --cov-branch
          --cov-report=term-missing --cov-report=xml
          --cov-fail-under=80

      - name: Contrato OpenAPI actualizado
        run: python tools/export_openapi.py --check

      - name: Subir coverage.xml
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  postgres:
    name: Integración con PostgreSQL 16 (ADR-003)
    runs-on: ubuntu-latest
    needs: calidad
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trucha
          POSTGRES_PASSWORD: trucha
          POSTGRES_DB: truchasmart
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trucha -d truchasmart"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PGPASSWORD: trucha
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: db/schema.sql y db/seed.sql cargan en PostgreSQL
        run: |
          python tools/init_db.py --url postgresql+psycopg://trucha:trucha@localhost:5432/truchasmart
          psql -h localhost -U trucha -d truchasmart -tAc "SELECT COUNT(*) FROM lecturas_agua" | grep -qx 168

      - name: Pruebas de integración contra PostgreSQL
        run: |
          createdb -h localhost -U trucha pruebas
          pytest tests/integration -m "not e2e"
        env:
          TEST_DATABASE_URL: postgresql+psycopg://trucha:trucha@localhost:5432/pruebas

  seguridad:
    name: Seguridad - SAST con Bandit y dependencias con pip-audit (RNF-+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[seguridad]"

      - name: Bandit (falla con hallazgos de severidad media o alta)
        run: |
          bandit -r src -f json -o bandit.json || true
          bandit -r src -ll

      - name: pip-audit (falla con vulnerabilidades conocidas)
        run: pip-audit -f json -o pip-audit.json && pip-audit

      - name: Subir reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seguridad
          path: |
            bandit.json
            pip-audit.json
          if-no-files-found: warn

  docker:
    name: Imagen Docker (restricción de despliegue)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen
        run: docker build -t truchasmart:ci .

      - name: La imagen arranca y responde /api/salud
        run: |
          docker run -d --name ts -p 8000:8000             -e APP_ENV=produccion -e JWT_SECRET="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"             truchasmart:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/salud && exit 0
            sleep 2
          done
          docker logs ts
          exit 1

      - name: En producción no arranca con la clave JWT de ejemplo
        run: |
          docker run -d --name inseguro -e APP_ENV=produccion truchasmart:ci
          sleep 8
          docker logs inseguro 2>&1 | tee inseguro.log
          grep -q "ConfiguracionInsegura" inseguro.log

  confiabilidad-rendimiento:
    name: Confiabilidad y rendimiento con PostgreSQL 16 (RNF-R/P)
    runs-on: ubuntu-latest
    needs: calidad
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trucha
          POSTGRES_PASSWORD: trucha
          POSTGRES_DB: truchasmart
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trucha -d truchasmart"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PGPASSWORD: trucha
      JWT_SECRET: clave-de-ci-para-rendimiento-de-32-bytes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,rendimiento]"

      - name: Caos - kill del servidor y caída de PostgreSQL (disponibilidad, MTTR, MTBF)
        run: |
          createdb -h localhost -U trucha caos
          python tools/prueba_confiabilidad.py --duracion 150 --fallos 4             --url-bd postgresql+psycopg://trucha:trucha@localhost:5432/caos             --pg-contenedor "$(docker ps -q --filter ancestor=postgres:16-alpine)"             --salida resultados-ci/confiabilidad

      - name: Carga - 500 usuarios con Locust (p95, RPS, memoria)
        run: |
          createdb -h localhost -U trucha carga
          python tools/prueba_carga.py --usuarios 500 --tasa 25 --duracion 120 --workers 4             --url-bd postgresql+psycopg://trucha:trucha@localhost:5432/carga             --salida resultados-ci/rendimiento

      - name: Resumen
        if: always()
        run: cat resultados-ci/*.md >> "$GITHUB_STEP_SUMMARY"

      - name: Subir resultados medidos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: confiabilidad-rendimiento
          path: resultados-ci/
          if-no-files-found: warn

  e2e:
    name: E2E (Playwright) y capturas de evidencia
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias y navegador
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m playwright install --with-deps chromium

      - name: Pruebas E2E
        run: pytest -m e2e tests/e2e

      - name: Subir capturas de evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias
          path: evidencias/
          if-no-files-found: warn
