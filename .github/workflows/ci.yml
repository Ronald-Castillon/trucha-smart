name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  calidad:
    name: Calidad (lint, arquitectura, pruebas, OpenAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Linter (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Pureza del dominio (M1.1)
        run: python tools/check_domain_purity.py

      - name: Contratos de arquitectura (import-linter)
        run: lint-imports

      - name: Contraste de la paleta WCAG 2.1 AA (RNF-U)
        run: python tools/contraste_paleta.py

      - name: Pruebas unitarias e integración con cobertura del dominio (M2.3)
        run: >
          pytest -m "not e2e"
          --cov=src/domain --cov-branch
          --cov-report=term-missing --cov-report=xml
          --cov-fail-under=80

      - name: Contrato OpenAPI actualizado
        run: python tools/export_openapi.py --check

      - name: Subir coverage.xml
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  postgres:
    name: Integración con PostgreSQL 16 (ADR-003)
    runs-on: ubuntu-latest
    needs: calidad
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trucha
          POSTGRES_PASSWORD: trucha
          POSTGRES_DB: truchasmart
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trucha -d truchasmart"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PGPASSWORD: trucha
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: db/schema.sql y db/seed.sql cargan en PostgreSQL
        run: |
          python tools/init_db.py --url postgresql+psycopg://trucha:trucha@localhost:5432/truchasmart
          psql -h localhost -U trucha -d truchasmart -tAc "SELECT COUNT(*) FROM lecturas_agua" | grep -qx 168

      - name: Pruebas de integración contra PostgreSQL
        run: |
          createdb -h localhost -U trucha pruebas
          pytest tests/integration -m "not e2e"
        env:
          TEST_DATABASE_URL: postgresql+psycopg://trucha:trucha@localhost:5432/pruebas

  e2e:
    name: E2E (Playwright) y capturas de evidencia
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias y navegador
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m playwright install --with-deps chromium

      - name: Pruebas E2E
        run: pytest -m e2e tests/e2e

      - name: Subir capturas de evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias
          path: evidencias/
          if-no-files-found: warn
